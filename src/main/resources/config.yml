# Präfix vor allen Nachrichten (Farbcodes mit &)
prefix: "&8[&6Turnier&8] &7"

scoreboard:
  title: "&6&lBEDWARS"
  # Aktualisierungsintervall in Ticks (20 Ticks = 1 Sekunde)
  refresh-ticks: 40

# Punkte pro Runde. Platzierungspunkte werden dem Team gutgeschrieben.
# Kills und Bettzerstörungen zählen zusätzlich für Spieler und Team.
points:
  first: 10
  second: 6
  third: 3
  kill: 1
  bed: 3
  bedless-elimination: 1
  bed-survived: 2
  # Legacy-Wert für ältere Konfigurationen; neue Wertung nutzt points.first.
  win: 10

# Anbindung an MBedwars (Kills, Bettzerstörungen und Rundensiege automatisch werten)
# Gewertet wird nur, wenn: Turnier gestartet, Runde läuft und /bwturnier on aktiv ist.
mbedwars:
  enabled: true
